name: "CodeQL"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 0 * * 0"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@b4ffde8f294c3d6f0a5d7c7f2f0f5e8e6c3c2f2c
        # SHA for actions/checkout v4.1.0 (immutable)

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c5418
        # SHA for CodeQL Action v4.38.3 (immutable)
        with:
          languages: javascript

      - name: Autobuild
        uses: github/codeql-action/autobuild@24c5418
        # Same SHA as init/analyze

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@24c5418
        # Same SHA as init/analyze